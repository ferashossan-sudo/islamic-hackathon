name: Keep the live demo awake

# Render's free plan spins the service down after 15 minutes without inbound traffic, and the next visitor waits
# about a minute. Through judging and the exhibition week (7 to 31 October 2026) a light request every 5 minutes
# keeps it awake.
# /health makes no model call, so the pings cost nothing.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the live site until the end of October
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261031 ]; then echo "Past the exhibition week; no ping."; exit 0; fi
          curl -fsS -o /dev/null -m 120 --retry 2 https://ltq-app.onrender.com/health
