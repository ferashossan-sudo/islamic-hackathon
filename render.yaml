services:
  - type: web
    name: ltq-app
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --no-access-log
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.16
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: APP_ENV
        value: prod
      - key: ROUTER_PROVIDER
        value: gemini
      - key: ROUTER_MODEL
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite
      - key: LLM_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: FRAMING_ENABLED
        value: "true"
      - key: CONVERSE_ENABLED
        value: "true"
      - key: DAILY_COST_CAP_USD
        value: "2"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SELFTEST_TOKEN
        generateValue: true
      - key: SUGGEST_FORM_URL
        sync: false
      - key: TEAM_EMAIL
        sync: false
      - key: SUBMISSION_COMMIT
        sync: false
